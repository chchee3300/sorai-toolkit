name: Release

# push to master: semantic-release decides whether/which version to release,
# every platform is built with `tauri build`, signed for the updater, and
# published as a GitHub Release with latest.json.
#
# Manual run (Actions -> Release -> Run workflow, any branch) with dry_run
# checked (the default): builds all four packages UNSIGNED under the fake
# version 0.0.<run number> and uploads them as workflow artifacts only -- no
# signing secrets needed, no tag, no release. Uncheck dry_run on master to
# force a real release run.
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build all platforms unsigned, upload as artifacts, publish nothing
        type: boolean
        default: true

# get-next-version's dry-run push check and the real release job both need
# write access to create tags/releases.
permissions:
  contents: write

# playwright (a devDependency, used only by the E2E tests) triggers a
# multi-hundred-MB browser-binary download on every `npm ci` unless this is
# set -- no job here runs the test suite, and this was severe enough to hit
# "No space left on device" on the macOS runner. Set globally so every job's
# `npm ci` skips it.
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  get-next-version:
    runs-on: ubuntu-latest
    outputs:
      # build: run the build matrix. publish: sign + release (false on dry runs).
      build: ${{ steps.version.outputs.will-release || steps.dry.outputs.will-release }}
      publish: ${{ steps.version.outputs.will-release == 'true' }}
      version: ${{ steps.version.outputs.version || steps.dry.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # semantic-release >=25 requires Node >=22.14.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: ${{ !inputs.dry_run }}
        run: npm ci
      - id: version
        if: ${{ !inputs.dry_run }}
        run: node scripts/get-next-version.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: dry
        if: ${{ inputs.dry_run }}
        run: |
          echo "will-release=true" >> "$GITHUB_OUTPUT"
          echo "version=0.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      # A release signed against the placeholder key would ship a latest.json
      # no installed app can verify -- stop before building anything.
      - name: Check the updater public key is filled in
        if: steps.version.outputs.will-release == 'true'
        run: |
          node -e "
            const k = require('./src-tauri/tauri.conf.json').plugins.updater.pubkey;
            if (k.startsWith('PLACEHOLDER')) {
              console.error('::error::src-tauri/tauri.conf.json plugins.updater.pubkey is still the placeholder. See README -> Releases -> Updater signing key.');
              process.exit(1);
            }"

  build:
    needs: get-next-version
    if: needs.get-next-version.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, target: x86_64-pc-windows-msvc }
          # 22.04 = oldest supported glibc/webkit2gtk-4.1 the packages then run on.
          - { name: linux, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { name: mac_arm64, os: macos-latest, target: aarch64-apple-darwin }
          - { name: mac_x64, os: macos-latest, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.get-next-version.outputs.version }}
      PUBLISH: ${{ needs.get-next-version.outputs.publish }}
    steps:
      # macos-latest ships several old Xcodes and an Android SDK this build
      # never touches; reclaim the space before cargo + hdiutil need it.
      - name: Free up disk space
        if: runner.os == 'macOS'
        run: |
          df -h /
          sudo rm -rf /Users/runner/Library/Android
          sudo rm -rf /Applications/Xcode_1[0-5]*.app
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      # Tauri's Linux build deps (webkit2gtk-4.1, ayatana appindicator for
      # the tray -- tauri-cli detects which one via pkg-config and declares
      # the matching runtime package in the deb/rpm), plus unzip for setup.mjs.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf unzip
      - run: npm ci
      # ffmpeg + yt-dlp everywhere, qpdf/img2pdf on Windows (binaries/<platform>/).
      - run: node setup.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # setup.mjs only fills the runner's own arch folder; the macOS ffmpeg
      # (evermeet.cx) and yt-dlp_macos builds are universal, so the x64 job on
      # the arm64 runner reuses them.
      - name: Populate the other mac arch folder
        if: runner.os == 'macOS'
        run: |
          for bin in ffmpeg yt-dlp; do
            for pair in "mac_arm64 mac_x64" "mac_x64 mac_arm64"; do
              set -- $pair
              if [ -f "binaries/$1/$bin" ] && [ ! -f "binaries/$2/$bin" ]; then
                mkdir -p "binaries/$2" && cp "binaries/$1/$bin" "binaries/$2/$bin"
              fi
            done
          done
      - run: node scripts/write-version.mjs "$VERSION"
      # VITE_OFFICIAL_BUILD is the only signal useUpdateChecker.js uses to tell
      # "built by this workflow" from a self-built copy (gates the updater
      # plugin install path). Only ever set here, never committed.
      # tauri.release.conf.json turns on createUpdaterArtifacts, which makes
      # `tauri build` sign with TAURI_SIGNING_PRIVATE_KEY (and fail without
      # it) -- so only real releases pass it; dry runs build unsigned.
      - name: tauri build
        run: |
          args=(--target "${{ matrix.target }}")
          if [ "$PUBLISH" = "true" ]; then args+=(--config src-tauri/tauri.release.conf.json); fi
          npx tauri build "${args[@]}"
        env:
          VITE_OFFICIAL_BUILD: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      # Tauri names bundles "SORAI Toolkit_<ver>_..."; GitHub would turn the
      # space into a dot on upload, so copy them to fixed, space-free names
      # (scripts/updater-manifest.mjs + .releaserc.json rely on these).
      # The Windows name deliberately does NOT match the Neutralino-era
      # updater's /setup.*win_x64\.exe$/ -- old installs must not silently
      # run this NSIS installer with Inno flags (see README "Upgrading from
      # 1.x").
      - name: Collect release assets
        run: |
          shopt -s nullglob
          B="src-tauri/target/${{ matrix.target }}/release/bundle"
          mkdir -p release-assets
          put() { cp "$1" "release-assets/$2"; if [ -f "$1.sig" ]; then cp "$1.sig" "release-assets/$2.sig"; fi; }
          case "${{ matrix.name }}" in
            windows)
              for f in "$B"/nsis/*-setup.exe; do put "$f" "sorai-toolkit_${VERSION}_x64-setup.exe"; done ;;
            linux)
              for f in "$B"/deb/*.deb; do put "$f" "sorai-toolkit_${VERSION}_amd64.deb"; done
              for f in "$B"/rpm/*.rpm; do put "$f" "sorai-toolkit-${VERSION}.x86_64.rpm"; done ;;
            mac_*)
              for f in "$B"/dmg/*.dmg; do put "$f" "sorai-toolkit_${VERSION}_${{ matrix.name }}.dmg"; done
              for f in "$B"/macos/*.app.tar.gz; do put "$f" "sorai-toolkit_${VERSION}_${{ matrix.name }}.app.tar.gz"; done ;;
          esac
          ls -la release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          path: release-assets/*
          if-no-files-found: error
          # Dry-run packages are kept for a week so they can be installed on
          # real machines; release packages only need to reach the next job.
          retention-days: ${{ needs.get-next-version.outputs.publish == 'true' && 1 || 7 }}

  release:
    needs: [get-next-version, build]
    if: needs.get-next-version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Download all built packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: packages-*
          merge-multiple: true
      - run: node scripts/updater-manifest.mjs "${{ needs.get-next-version.outputs.version }}"
      - run: ls -la release-assets
      # Stamps the real version into src/version.json + src-tauri/tauri.conf.json
      # in *this* checkout so @semantic-release/git (.releaserc.json) commits
      # them back as part of the "chore(release)" commit.
      - run: node scripts/write-version.mjs "${{ needs.get-next-version.outputs.version }}"
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
