[package]
name = "sorai-toolkit"
version = "0.1.0"
description = "SORAI Toolkit"
authors = ["chchee3300"]
license = "MIT"
repository = "https://github.com/chchee3300/sorai-toolkit"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
